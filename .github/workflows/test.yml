name: Test and Deploy

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test


  deploy:
    name: Deploy to Vercel
    needs: test
    runs-on: ubuntu-latest

    # Only deploy after tests pass on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: |
          vercel link \
            --yes \
            --project "$PROJECT_ID" \
            --token "$VERCEL_TOKEN" \
            --scope "$TEAM_ID"
        env:
          PROJECT_ID: ${{ secrets.PROJECTID }}
          TEAM_ID: ${{ secrets.TEAMID }}
          VERCEL_TOKEN: ${{ secrets.VERCELTOKEN }}

      - name: Pull Vercel project settings
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token "$VERCEL_TOKEN" \
            --scope "$TEAM_ID"
        env:
          TEAM_ID: ${{ secrets.TEAMID }}
          VERCEL_TOKEN: ${{ secrets.VERCELTOKEN }}

      - name: Deploy to Vercel
        run: |
          vercel deploy \
            --prod \
            --token "$VERCEL_TOKEN" \
            --scope "$TEAM_ID"
        env:
          TEAM_ID: ${{ secrets.TEAMID }}
          VERCEL_TOKEN: ${{ secrets.VERCELTOKEN }}
